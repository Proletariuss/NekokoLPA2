version: 3
kind: carrier_bundle
id: apple_crosswireless_bravado_lte_us
bundle: CrossWireless_Bravado_LTE_US.bundle
supported_plmns:
    - "313010"
plmn_overrides:
    "313010":
        apns:
            - apn: tuligw
              type_mask: 567
              allowed_ip_stack: ipv4v6
              use_network_mtu: true
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              use_network_mtu: true
            - apn: hos
              type_mask: 1048576
              allowed_ip_stack: ipv4
              use_network_mtu: true
            - apn: sos
              type_mask: 262144
              allowed_ip_stack: ipv4
              roaming_ip_stack: ipv4v6
              use_network_mtu: true
        e911:
            wifi_calling_without_entitlement: true
            emergency_urns:
                "922": 922@vzims.com
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                sip_timers:
                    D: 128000
                    F: 30000
                    InviteResponseTimeout: 10000
                    T1: 3000
                    T2: 16000
                    T4: 17000
            media:
                codecs:
                    - payload_type: 102
                      name: AMR
                      clock_rate: 8000
                      channels: 1
                      fmtp: octet-align=0; mode-set=7
                    - payload_type: 104
                      name: AMR-WB
                      clock_rate: 16000
                      channels: 1
                      fmtp: octet-align=0; mode-set=2
                    - payload_type: 106
                      name: AMR
                      clock_rate: 8000
                      channels: 1
                      fmtp: octet-align=0
                    - payload_type: 108
                      name: AMR
                      clock_rate: 8000
                      channels: 1
                      fmtp: octet-align=1; mode-set=7
                    - payload_type: 110
                      name: AMR-WB
                      clock_rate: 16000
                      channels: 1
                      fmtp: octet-align=1; mode-set=2
                    - payload_type: 115
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-16.4; bw=nb-wb
                mode_set_amr_nb: "7"
                mode_set_amr_wb: "2"
                support_amr_nb: false
                support_amr_wb: false
                rtp_inactivity_seconds: 10
                rtcp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
                use_ephemeral_rtp_ports: true
                enable_incoming_dtmf: true
                evs_hard_bw_limit: nb-swb
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
