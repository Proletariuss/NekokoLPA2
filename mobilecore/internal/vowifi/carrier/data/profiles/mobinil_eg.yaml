version: 3
kind: carrier_bundle
id: apple_mobinil_eg
bundle: mobinil_eg.bundle
supported_plmns:
    - "60201"
plmn_overrides:
    "60201":
        apns:
            - apn: mobinilweb
              type_mask: 49
            - apn: mobinilmms
              type_mask: 4
        ims:
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                support_p_early_media: false
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - 5XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 96
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=9.6-24.4; bw=swb
                    - payload_type: 97
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb
                preferred_amr_wb_mode: 8
                rtp_inactivity_seconds: 20
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
