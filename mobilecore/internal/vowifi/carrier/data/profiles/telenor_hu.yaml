version: 3
kind: carrier_bundle
id: apple_telenor_hu
bundle: Telenor_hu.bundle
supported_plmns:
    - "21601"
plmn_overrides:
    "21601":
        apns:
            - apn: online
              type_mask: 49
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
            - apn: mms
              type_mask: 4
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv6
        ims:
            apn: ims
            ip_stack: ipv6
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=-1
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
                evs_hard_bw_limit: nb-swb
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
