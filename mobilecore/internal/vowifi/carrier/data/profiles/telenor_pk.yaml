version: 3
kind: carrier_bundle
id: apple_telenor_pk
bundle: Telenor_pk.bundle
supported_plmns:
    - "41006"
plmn_overrides:
    "41006":
        apns:
            - apn: internet
              username: Telenor
              password: Telenor
              type_mask: 49
            - apn: mms
              username: telenor
              password: telenor
              type_mask: 4
            - apn: ims
              type_mask: 131072
        ims:
            apn: ims
            signaling:
                preconditions: supported
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "500"
                        - "503"
                        - "504"
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                            - +g.3gpp.mid-call
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=-1
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
