version: 3
kind: carrier_bundle
id: apple_sky_ie
bundle: Sky_ie.bundle
supported_plmns:
    - "24007"
    - "27225"
common:
    apns:
        - apn: mobile.sky
          type_mask: 32819
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
        - apn: ut.mobile.sky
          type_mask: 1048576
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 8193
    entitlement:
        entitlement_url: https://esim-es-open-prod-skyroi.esimcloud.net/skyroi/prod/executeAppleActions/
    ims:
        media:
            codecs:
                - payload_type: 127
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=-1
            evs_hard_bw_limit: nb-swb
        register:
            use_ipsec: true
        volte:
            enable_volte_by_default: true
