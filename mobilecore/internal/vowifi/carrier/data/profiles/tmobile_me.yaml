version: 3
kind: carrier_bundle
id: apple_tmobile_me
bundle: TMobile_me.bundle
supported_plmns:
    - "29702"
plmn_overrides:
    "29702":
        apns:
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4
              roaming_ip_stack: ipv4
              no_cellular_reconnect_cause_codes:
                - cause_codes:
                    - 30
                    - 33
                  recovers_on_airplane_mode: true
                  num_tries_allowed: 2
                  type: 3GPP
                  timeout: 86400
            - apn: tmcg-4G
              username: "38267"
              password: "38267"
              type_mask: 49
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
              xlat464_enabled: true
            - apn: hos
              type_mask: 1048576
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
              xlat464_enabled: true
        ims:
            apn: ims
            ip_stack: ipv4
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    InviteResponseTimeout: 4000
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=-1; cmr=1
                mode_set_amr_wb: 0,1,2
                rtp_inactivity_seconds: 20
                rtcp_inactivity_seconds: 180
                rtcp_interval_seconds: 5
                dtmf_digit_duration_ms: 255
                evs_hard_bw_limit: nb-swb
                include_evs_io_modes: true
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
