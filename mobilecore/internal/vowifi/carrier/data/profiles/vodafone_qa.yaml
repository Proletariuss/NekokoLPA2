version: 3
kind: carrier_bundle
id: apple_vodafone_qa
bundle: Vodafone_qa.bundle
supported_plmns:
    - "20404"
    - "42702"
common:
    apns:
        - apn: web.vodafone.com.qa
          type_mask: 32817
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4
        - apn: ims
          type_mask: 131072
          allowed_ip_stack: ipv4
          use_network_mtu: true
        - apn: xcap
          type_mask: 1048576
          allowed_ip_stack: ipv4
    apple:
        carrier_entitlements:
            supported_entitlements: 13313
    entitlement:
        entitlement_url: https://entitlement.vodafone.com.qa/ium-OEMInterface/servlet/IUMServlet
    ims:
        apn: ims
        ip_stack: ipv4
        media:
            codecs:
                - payload_type: 109
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=-1
            evs_hard_bw_limit: nb-swb
            preferred_amr_wb_mode: 8
            rtcp_interval_seconds: 5
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.srvcc-alerting
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - "403"
                    - "500"
                    - "503"
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
