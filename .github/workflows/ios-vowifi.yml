name: Reader-backed iOS VoWiFi

on:
  pull_request:
    branches: [master, release]
    paths:
      - 'mobilecore/**'
      - 'local_packages/proletarius_vowifi/**'
      - 'local_packages/ccid/ios/**'
      - 'lib/**'
      - 'test/**'
      - 'l10n/app_en.arb'
      - 'ios/**'
      - 'pubspec.*'
      - 'scripts/*vowifi*'
      - '.github/workflows/ios-vowifi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-vowifi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and security regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            mobilecore/go.sum
            mobilecore/third_party/swu-go/go.sum
      - name: Main core
        working-directory: mobilecore
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Nested SWu module
        working-directory: mobilecore/third_party/swu-go
        run: |
          go test -race -count=1 ./...
          go vet ./...

  ios:
    name: Darwin trust, Flutter and unsigned iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: |
            mobilecore/go.sum
            mobilecore/third_party/swu-go/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Install pinned mobile binding tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
      - name: Darwin certificate validation
        working-directory: mobilecore/third_party/swu-go
        run: |
          go test -race -count=1 ./pkg/swu ./pkg/ikev2
          CGO_ENABLED=0 go test -count=1 ./pkg/swu
      - name: Dependency notice inventory
        run: python3 scripts/generate_vowifi_notices.py --check
      - name: Recovery policy
        run: |
          swiftc local_packages/proletarius_vowifi/ios/Classes/VowifiRecoveryPolicy.swift scripts/test_vowifi_recovery.swift -o "$RUNNER_TEMP/vowifi-recovery-test"
          "$RUNNER_TEMP/vowifi-recovery-test"
      - run: flutter pub get
      # Keep the feature strict; record the unrelated upstream warning separately.
      - name: Analyze the feature and modified host boundaries
        run: >-
          flutter analyze --no-pub
          lib/vowifi lib/main.dart lib/pages/profiles_screen.dart
          lib/adapter/euicc_adapter.dart lib/adapter/composite_adapter.dart
          lib/adapter/ccid/ccid_adapter.dart lib/adapter/ble/red_ble_adapter.dart
          lib/adapter/ble/red_ble2_adapter.dart
          lib/services/local_notification_service.dart lib/settings/app_settings.dart
          local_packages/proletarius_vowifi test/vowifi
          test/adapter/exclusive_admission_test.dart
          test/adapter/ccid_vowifi_connection_test.dart
          test/services/vowifi_local_notification_test.dart
      - run: flutter test --no-pub
      - name: Source-built framework and unsigned app
        run: bash scripts/build_ios_vowifi.sh --app

  web:
    name: Preserve non-iOS compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-pub
